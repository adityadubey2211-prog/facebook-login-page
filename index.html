<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="page">
        <div class="tittle">
            <h1 class="heading">facebook</h1>
            <p class="para"><b>Facebook helps you connect and share with people.</b></p>
        </div>
    </section>
    <section>
        <div class="main">
            <form class="main">
                <div class="phone">
                <input type="username" placeholder="Email or phone no"><br>
                </div>
                <div class="pass">
                <input type="passward" placeholder="passward"><br>
                </div>
                <div class="button">
                <pre>log in</pre><br>
                </div>
                <div class="forget">
                <a href="#">forget passward</a><br>
                </div>
                <div class="npass">
                <button>create a new account</button>
                </div>
            </form>
            <footer class="foot">
                    <pre>Create a Page for a celebrity, brand, or business .</pre>
            </footer>
        </div>
    </section>
</body>
</html>
